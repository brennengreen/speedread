name: CI

on:
  push:
    branches: [main]
    # Without a tags filter, pushing a tag would not run this workflow at all.
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: SPEEDREAD_WALKER=portable cargo test --all-targets
      - run: cargo build --release

  release:
    name: release binary (macOS arm64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      # Version-less asset name, so releases/latest/download/<asset> is a stable URL.
      - run: |
          cd target/release
          tar czf speedread-aarch64-apple-darwin.tar.gz speedread
          shasum -a 256 speedread-aarch64-apple-darwin.tar.gz > sha256.txt
      # docs/releases/<tag>.md, if present: its first line ("# title") names the
      # release and the rest is the body. Otherwise GitHub generates notes.
      - name: Release notes
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "title=$(head -n 1 "$f" | sed 's/^# *//')" >> "$GITHUB_OUTPUT"
            tail -n +2 "$f" > "$RUNNER_TEMP/notes.md"
            echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title || github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            target/release/speedread-aarch64-apple-darwin.tar.gz
            target/release/sha256.txt
