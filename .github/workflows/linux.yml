# Linux uses the portable walker; macOS-only code is cfg-gated. The tests first
# passed here on 2026-09-26, so this runs on every push and pull request.
# Clippy isn't enforced on Linux yet: see ROADMAP.md (macOS-only walker helpers).
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (Ubuntu 24.04, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - name: Smoke test the CLI (tests/mcp.rs covers the MCP protocol)
        run: |
          bin=target/release/speedread
          $bin --version
          $bin --root . read 'src/lib.rs'
          $bin --root . search 'fn worker_threads'
          $bin --root . trace '#worker_threads'
