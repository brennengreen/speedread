[package]
name = "speedread"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "The fastest, most token-efficient file reader for AI coding agents (MCP server + CLI), built for macOS."
license = "MIT"
readme = "README.md"
repository = "https://github.com/brennengreen/speedread"
keywords = ["mcp", "agents", "tree-sitter", "llm", "code-navigation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
imara-diff = "0.2"
libc = "0.2"
memchr = "2.8"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.12"
rayon = "1.12"
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
simdutf8 = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-objc = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

strip = true

[profile.bench]
inherits = "release"
strip = false

# Quick local iteration: `cargo build --profile fast` (no LTO).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
