<text x="40" y="80" font-size="14.5" fill="#98a1b8">10 code questions × 3 trials per condition · claude-sonnet-5 via GitHub Copilot CLI · exact tokens from the harness&#x27;s usage log · pass@1 97% → 100%</text>
