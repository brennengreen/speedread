<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="556" viewBox="0 0 1280 556" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xml:space="preserve">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
